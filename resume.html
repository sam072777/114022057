<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人履歷 - 亞洲大學</title>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 40px; background-color: #f0f2f5; }
        .resume-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        header { border-bottom: 3px solid #0056b3; padding-bottom: 20px; margin-bottom: 30px; text-align: center; }
        h1 { margin: 0; color: #0056b3; font-size: 2.5em; }
        .info { color: #555; font-size: 1.1em; margin-top: 10px; }
        section { margin-bottom: 35px; }
        h3 { color: #0056b3; border-left: 6px solid #0056b3; padding-left: 15px; margin-bottom: 15px; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 12px; padding: 12px; background: #f8f9fa; border-radius: 6px; border-left: 3px solid #dee2e6; }
        .skill-tag { display: inline-block; background: #0056b3; color: #fff; padding: 6px 15px; border-radius: 25px; font-size: 0.9em; margin: 5px; transition: 0.3s; }
        .skill-tag:hover { background: #004494; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="resume-card">
        <header>
            <h1>個人履歷</h1>
            <p class="info">亞洲大學 | 學號：114022057</p>
        </header>

        <section>
            <h3>關於我</h3>
            <p>我是就讀於亞洲大學的學生，目前正在學習網頁開發與數位工具的應用。我喜歡挑戰新事物，具備良好的學習態度與解決問題的決心。</p>
        </section>

        <section>
            <h3>專業技能與工具</h3>
            <div>
                <span class="skill-tag">HTML / CSS</span>
                <span class="skill-tag">Git & GitHub</span>
                <span class="skill-tag">VS Code 基礎操作</span>
                <span class="skill-tag">邏輯思維與運算思考</span>
            </div>
        </section>

        <section>
            <h3>學習經歷</h3>
            <ul>
                <li><strong>亞洲大學</strong> - 學士學位 (在學中)</li>
                <li><strong>網頁前端實務練習</strong> - 成功利用 GitHub Pages 部署個人靜態網頁。</li>
            </ul>
        </section>
    </div>
</body>
</html>
